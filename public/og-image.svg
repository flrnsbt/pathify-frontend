<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#1e1b4b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo -->
  <image href="icon.svg" x="80" y="165" width="300" height="300" preserveAspectRatio="xMidYMid meet"/>

  <!-- Wordmark -->
  <text x="430" y="290" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="url(#textGrad)" letter-spacing="-1">vectorizerr</text>
  <text x="432" y="350" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#a3a3a3">Raster to SVG Vector Graphics Studio</text>

  <!-- Divider -->
  <rect x="432" y="392" width="420" height="2" fill="#3f3f46"/>

  <!-- Tagline + URL -->
  <text x="432" y="438" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#d4d4d8">High-performance, private vectorization</text>
  <text x="432" y="478" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#6366f1">vectorizerr.pages.dev</text>
</svg>
