<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Space Titanium Gradient -->
    <linearGradient id="v3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1322"/>
      <stop offset="40%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>

    <!-- Squircle Rim Glow -->
    <linearGradient id="v3-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Radial Core Ambient Glow -->
    <radialGradient id="v3-ambient" cx="50%" cy="54%" r="56%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Left Wing Gradient (Cyan 400 -> Blue 500 -> Indigo 600) -->
    <linearGradient id="v3-wing-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Right Wing Gradient (Indigo 500 -> Violet 500 -> Fuchsia 500 -> Rose 500) -->
    <linearGradient id="v3-wing-right" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="30%" stop-color="#8b5cf6"/>
      <stop offset="65%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Specular Highlight for Ridge Edges -->
    <linearGradient id="v3-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Center Fold Depth Shadow -->
    <linearGradient id="v3-fold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Deep Drop Shadow for 3D Floating Vector Mark -->
    <filter id="v3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Soft Bloom for Nodes -->
    <filter id="v3-node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#v3-bg)" stroke="url(#v3-rim)" stroke-width="2.5"/>

  <!-- Precision Vector Grid System (Subtle Background Geometry) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.2">
    <circle cx="256" cy="256" r="192" fill="none" stroke-dasharray="6 6"/>
    <circle cx="256" cy="256" r="128" fill="none" stroke-dasharray="4 6"/>
    <line x1="256" y1="44" x2="256" y2="468" stroke-dasharray="4 4"/>
    <line x1="44" y1="256" x2="468" y2="256" stroke-dasharray="4 4"/>
    <!-- Diagonal 45-deg construction guides -->
    <line x1="120" y1="120" x2="392" y2="392" stroke-dasharray="2 6"/>
    <line x1="392" y1="120" x2="120" y2="392" stroke-dasharray="2 6"/>
  </g>

  <!-- Ambient Radiant Core Glow -->
  <circle cx="256" cy="272" r="185" fill="url(#v3-ambient)"/>

  <!-- ==================== MAIN VECTOR P ==================== -->
  <g filter="url(#v3-shadow)">
    <!-- STEM: Vertical flowing ribbon -->
    <path d="M 124 128
             C 114 220, 114 320, 124 396
             L 186 396
             C 196 320, 196 220, 186 128
             Z"
          fill="url(#v3-wing-left)"/>

    <!-- Stem Outer Specular Bevel Line -->
    <path d="M 124 128 C 114 220, 114 320, 124 396"
          fill="none"
          stroke="url(#v3-specular)"
          stroke-width="2.5"
          opacity="0.9"/>

    <!-- Stem Centerline Trace (Dotted precision vector guide) -->
    <path d="M 150 132 C 143 224, 143 316, 150 392"
          fill="none"
          stroke="#ffffff"
          stroke-width="1.2"
          stroke-dasharray="3 4"
          opacity="0.45"/>

    <!-- BOWL: Soaring ribbon arc returning to the stem -->
    <path d="M 182 138
             C 300 100, 398 162, 400 246
             C 402 314, 352 352, 288 348
             C 252 346, 224 330, 202 306"
          fill="none"
          stroke="url(#v3-wing-right)"
          stroke-width="64"
          stroke-linecap="round"/>

    <!-- Bowl Outer Specular Bevel Arc -->
    <path d="M 236 108 C 322 96, 392 152, 402 226"
          fill="none"
          stroke="url(#v3-specular)"
          stroke-width="3"
          opacity="0.85"/>

    <!-- Bowl Centerline Trace (Dotted precision vector guide) -->
    <path d="M 182 138
             C 300 100, 398 162, 400 246
             C 402 314, 352 352, 288 348
             C 252 346, 224 330, 202 306"
          fill="none"
          stroke="#ffffff"
          stroke-width="1.2"
          stroke-dasharray="3 4"
          opacity="0.45"/>

    <!-- Bowl Counter Inner Edge Hint -->
    <path d="M 214 190 C 262 168, 322 190, 344 240 C 358 276, 344 306, 312 318"
          fill="none"
          stroke="url(#v3-fold)"
          stroke-width="10"
          stroke-linecap="round"
          opacity="0.5"/>

    <!-- Central Illuminated Vector Spark / Diamond Facet -->
    <polygon points="298,208 322,238 298,268 274,238"
             fill="#ffffff"
             opacity="0.18"/>
    <polygon points="298,224 310,238 298,252 286,238"
             fill="#ffffff"
             opacity="0.4"/>
  </g>

  <!-- ==================== PRECISION BÉZIER NODES & HANDLES ==================== -->

  <!-- Stem Top Tangent Arm & Control Handle Endpoints -->
  <line x1="70" y1="142" x2="138" y2="86" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.9"/>
  <circle cx="70" cy="142" r="5" fill="#22d3ee" stroke="#ffffff" stroke-width="1.5" filter="url(#v3-node-glow)"/>
  <circle cx="138" cy="86" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" filter="url(#v3-node-glow)"/>

  <!-- Stem Top Anchor Node (Diamond with glowing white center) -->
  <rect x="145" y="118" width="16" height="16" rx="2" transform="rotate(45 155 128)"
        fill="#ffffff" stroke="#0284c7" stroke-width="3" filter="url(#v3-node-glow)"/>

  <!-- Bowl Top-Right Tangent Arm & Control Handle Endpoints -->
  <line x1="368" y1="104" x2="436" y2="168" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 3" opacity="0.9"/>
  <circle cx="368" cy="104" r="5" fill="#d946ef" stroke="#ffffff" stroke-width="1.5" filter="url(#v3-node-glow)"/>
  <circle cx="436" cy="168" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5" filter="url(#v3-node-glow)"/>

  <!-- Bowl Top-Right Anchor Node (Diamond with glowing white center) -->
  <rect x="380" y="196" width="16" height="16" rx="2" transform="rotate(45 388 204)"
        fill="#ffffff" stroke="#c026d3" stroke-width="3" filter="url(#v3-node-glow)"/>

  <!-- Bowl-to-Stem Join Tangent Arm & Control Handle Endpoints -->
  <line x1="146" y1="336" x2="206" y2="312" stroke="#c084fc" stroke-width="2" stroke-dasharray="3 3" opacity="0.9"/>
  <circle cx="146" cy="336" r="5.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" filter="url(#v3-node-glow)"/>
  <circle cx="206" cy="312" r="5.5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5" filter="url(#v3-node-glow)"/>

  <!-- Bowl-to-Stem Join Anchor Node (Diamond with glowing white center) -->
  <rect x="192" y="296" width="18" height="18" rx="2" transform="rotate(45 201 305)"
        fill="#ffffff" stroke="#7c3aed" stroke-width="3.5" filter="url(#v3-node-glow)"/>

  <!-- Stem Baseline Tangent Handle Arm & Endpoints -->
  <line x1="92" y1="404" x2="222" y2="404" stroke="#c084fc" stroke-width="2" stroke-dasharray="3 3" opacity="0.9"/>
  <circle cx="92" cy="404" r="5.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" filter="url(#v3-node-glow)"/>
  <circle cx="222" cy="404" r="5.5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5" filter="url(#v3-node-glow)"/>

  <!-- Stem Baseline Anchor Node (Diamond with glowing white center) -->
  <rect x="145" y="386" width="20" height="20" rx="2" transform="rotate(45 155 396)"
        fill="#ffffff" stroke="#7c3aed" stroke-width="3.5" filter="url(#v3-node-glow)"/>

</svg>