<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vz-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="vz-grad-secondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="vz-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background subtle squircle -->
  <rect width="92" height="92" x="4" y="4" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2" />
  
  <!-- Outer glowing vector ribbon -->
  <path d="M 22 74 C 20 45, 45 20, 76 22 C 80 48, 55 78, 22 74 Z" 
        fill="url(#vz-grad-primary)" 
        opacity="0.85" 
        filter="url(#vz-glow)" />

  <!-- Dynamic inner Bezier curve -->
  <path d="M 26 68 C 36 28, 70 32, 74 68 C 58 54, 42 76, 26 68 Z" 
        fill="url(#vz-grad-secondary)" 
        opacity="0.9" />

  <!-- Vector Anchor Points (Nodes & Handles) -->
  <!-- Top Node -->
  <circle cx="50" cy="24" r="4.5" fill="#ffffff" stroke="#6366f1" stroke-width="2" />
  
  <!-- Left Node -->
  <circle cx="24" cy="70" r="4.5" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" />
  
  <!-- Right Node -->
  <circle cx="76" cy="68" r="4.5" fill="#ffffff" stroke="#d946ef" stroke-width="2" />

  <!-- Center focal spark -->
  <polygon points="50,42 53,49 60,50 54,55 56,62 50,58 44,62 46,55 40,50 47,49" fill="#ffffff" opacity="0.95" />
</svg>
